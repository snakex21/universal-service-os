; USOS Legacy Compatibility / Post-Install Pack - manifest (format 1).
; Copyright (C) 2026 Maksymilian and the USOS Authors. GPL-3.0-or-later.
; Design and inventory: docs/design/legacy-compat-pack.md.
;
; This file is data for three readers: the post-install runner USOSADD.EXE
; on the installed Windows 95/98/Me/NT4 (src/platform/win32_legacy/usosadd),
; the host tools (tools/addons/legacy_manifest.py: validation, staging) and
; the menu/installer UI. The repo copy is UTF-8; the staging tool writes it
; to the target as C:\USOS\ADDONS\LEGACY.INI in the target's ANSI code page
; (cp1250 for Polish, cp1252 otherwise), because the runner shows names_pl
; with the ANSI Win32 API.
;
; Keys (sections [pkg:<id>]):
;   name_pl, name_en  display names
;   dir        8.3 folder under C:\USOS\ADDONS\PKG (DOS COPY and NT4 $OEM$
;              need 8.3 names; every staged file name is 8.3 too)
;   os         systems it may run on (tokens from [pack] os; groups 95 98 9X)
;   lang       PL, EN or * (compared with the installed system's language)
;   ntsp       NT4 service pack condition: 6a+ (at least) or <6a (below)
;   tier       full   = part of "Pełny pakiet zgodności" for every listed os
;              option = separate checkbox, officially supported
;              group  = no action; its needs= pull members in (UI group);
;                       its order= comes after all members
;              none   = only pulled in through needs= (members of a group)
;   order     run order (phases: 050 SP, 100 DCOM, 200 IE, 300 MSI,
;              400 DirectX, 450 MDAC, 500 runtimes, 600 media, 700 .NET,
;              800 USB/storage, 850 tools, 950 hotfixes, 970 KernelEx, 980 boot)
;   needs      capabilities name:version that must be present (built into the
;              OS, see [os:*], or provided by an earlier package); a needed
;              capability that no selected package provides pulls in an
;              applicable provider (any tier)
;   provides   capabilities name:version this package adds
;   check      already-installed test, skips the package when true:
;              file:<path>[>=<ver>]  regver:<key>,<value>>=<ver>
;              reg:<key>[,<value>]   regdw:<key>,<value>>=<n>   ntsp:<level>
;   reboot     now = restart before the next package; end = a restart is
;              needed but may be batched; no
;   fileN      <8.3 staged name>|<original name>|<sha256>|<size>
;              original may be container!member (member hash pinned)
;   unpack     zip = staged by the host as the zip's files (root folder
;              stripped, 8.3 names only); none otherwise
;   runN       commands, in order; variables %PKG% %TMP% %WIN% %SYS% %PF%
;              %ADD%; arguments with spaces in "quotes"; builtins: copy <src> <dst> (only if newer or missing),
;              force <src> <dst> (always overwrite), attrib <file> (clears R/H/S),
;              append <file> <text>, cd <dir> <command> (run in <dir>),
;              inf <file> [section], msi <file> [properties]
;   status     empty = ready; missing = no pinned file yet; needs-iss = an
;              InstallShield response file must be recorded first (both are
;              shown greyed out and never run)
;   codes      accepted exit codes (default 0,3010)
;   source     bundled = USOS's own file in the payload;
;              release = Microsoft redistributable in the separate release
;              asset USOS-<version>-Legacy-pack-MS.zip (embedded in the full
;              installer, downloaded by the online one; SHA-256 pinned),
;              needs decision=; user = the user's file in DATA\Addons.
;              All three are matched by SHA-256 when staging; the staging
;              tool itself never downloads.
;   decision   maintainer-2026-09-30 = shipped under the maintainer's
;              own-risk decision (docs/LICENSES-AUDIT.md section 8)
;   redist     yes / no / conditional / unknown (docs/LICENSES-AUDIT.md,
;              section 8)
;   license    SPDX id or LicenseRef-*
;   bridge     yes = user file used as a temporary bridge, "do zastąpienia
;              własną implementacją" (a clean-room GPL replacement is planned)
;   verify     what still needs a VM run before the step is trusted
;   note       free text

[pack]
format=1
id=legacy
version=2026.09.30
os=95RTM,95OSR1,95OSR2,95OSR21,95OSR25,98FE,98SE,ME,NT4
; groups usable in os=
group_95=95RTM,95OSR1,95OSR2,95OSR21,95OSR25
group_98=98FE,98SE
group_9X=95RTM,95OSR1,95OSR2,95OSR21,95OSR25,98FE,98SE,ME
; installed to C:\USOS\ADDONS; the runner logs to ..\addons.log (C:\USOS\addons.log)
root=C:\USOS\ADDONS

; ---------------------------------------------------------------------------
; Presets (UI: one choice instead of a long checkbox list; details expandable).
; full=1 takes every tier=full package of the system; options= adds
; packages (ignored where they do not apply); the user's SELECT.INI may add
; options= and remove exclude= on top. The first preset is the default.
; ---------------------------------------------------------------------------
[presets]
order=praca,retro,minimal
default=praca

[preset:praca]
name_pl=Do pracy (pełny pakiet zgodności)
name_en=Ready for work (full compatibility pack)
full=1
options=

[preset:retro]
name_pl=Retro gry
name_en=Retro games
full=0
options=dx80-pl,dx9c,vbrun6sp6,vcredist6sp6,mslu,msi20-9x,aspi471,winmedos,nusb33-pl,wmp64,wmp71-pl,wmp9-pl
note=DirectX, game runtimes, ASPI (CD images and copy protection of period games), real DOS mode on Me, USB sticks; no .NET, MDAC, IE upgrade or office-type components.

[preset:minimal]
name_pl=Minimalny
name_en=Minimal
full=0
options=nt4-sp6a-pl,nt4-sp6a-en,nt4-srp-pl,nusb33-pl,hotfixes-98-pl
note=Only the service pack and security rollup (NT4), USB storage and the security updates.

