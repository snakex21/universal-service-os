; VirtualBox install test of the tweaks (tools/tests/run_answer_vbox.py --profile).
; Every tweak on; the renderer keeps those the system has.
[usos-profile]
name=VBox tweaks
user=Tester
computer=USOS-VBOX
org=USOS
password=
timezone=Europe/Warsaw
language=pl-PL
remember_key=no
manual_disk=yes
local_account=yes
systems=windows
skip_games=yes
theme=classic
disable_uac=yes
no_sidebar=yes
no_welcome_center=yes
no_hibernation=yes
show_extensions=yes
show_hidden=yes
no_autorun=yes
